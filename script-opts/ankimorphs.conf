# Anki profile containing ankimorphs.db and AnkiMorphs profile settings.
profile_dir=~/.local/share/Anki2/User 1

# spaCy virtualenv created/used by AnkiMorphs. Its bin/python is used by default.
spacy_venv=~/.local/share/Anki2/addons21/spacy-venv-python-3_14
python=

# AnkiMorphs database and user priority-file directory.
db_path=~/.local/share/Anki2/User 1/ankimorphs.db
priority_dir=~/.local/share/Anki2/User 1/priority-files
priority_file=

# Highlight cache is stored in tmpfs under /tmp/mpv-ankimorphs-UID by default.
# Set a custom path only if needed; keep it on /tmp to preserve volatility.
cache_dir=

# spaCy model installed inside the virtualenv. Use Ctrl+Alt+m to choose an installed model.
spacy_model=de_core_news_lg

# primary = sub-text, secondary = secondary-sub-text. Ctrl+Alt+s switches at runtime.
subtitle_source=primary
# Main AnkiMorphs highlighting toggle (independent of the dictionary companion).
# Set empty to disable the physical key; script-binding ankimorphs/ankimorphs-toggle remains available.
toggle_highlighting_key=ctrl+alt+h
enabled=yes

# OSD styling.
font_size=38
font_name=Noto Sans
outline=2
bottom_margin=48

# ASS BGR colors corresponding to AnkiMorphs' default CSS colors.
status_unknown=&HFF0000&
status_learning=&H3DB38B&
status_known=&H008000&
status_undefined=&H808080&
