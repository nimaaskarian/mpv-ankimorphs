# Local dictd database. Install/configure dictd and the dict client separately.
dict_program=dict
dict_database=deu-eng
# Optional remote dictd endpoint. Leave blank to use ~/.dictrc and system defaults.
dict_host=
dict_port=

# Show a translation tooltip when the pointer rests on a colored morph.
hover_tooltip=yes
hover_delay=0.12
tooltip_font_size=21
tooltip_max_lines=9
tooltip_max_chars=440
# Tooltip background and spacing. Opacity is 0 (transparent) to 1 (opaque).
tooltip_background_color=&H000000&
tooltip_background_opacity=0.4
tooltip_padding_x=12
tooltip_padding_y=8
tooltip_collision_gap=14
# Mouse hit-testing uses approximate Noto Sans glyph advances; adjust if needed.
hit_width_scale=1.0

# Toggle the dictionary companion on/off. This does not disable AnkiMorphs highlighting.
toggle_extension_key=ctrl+alt+e

# Keyboard-only navigation over colored morphs in the current subtitle cue.
# Previous/next cycle through highlighted words in reading order.
select_previous_key=ctrl+alt+LEFT
select_next_key=ctrl+alt+RIGHT
# Unknown-only navigation. By default it selects only unknown morphs.
select_next_unknown_key=ctrl+alt+u
select_previous_unknown_key=ctrl+alt+shift+u
# Include fresh/learning morphs in both unknown-navigation directions.
# Disabled by default, preserving the strict unknown-only behavior.
include_learning_in_unknown_navigation=no
# Automatically select the first unknown (or included learning) morph when a
# new subtitle cue appears. Disabled by default.
auto_select_first_unknown_on_new_cue=no

# Automatically show the dictd tooltip while navigating. These are independent
# and both disabled by default.
auto_dictionary_on_morph_navigation=no
auto_dictionary_on_unknown_navigation=no

# Look up the surface form first, then try its lemma if no entry exists.
show_dictionary_key=ctrl+alt+d
# Look up only the spaCy lemma of the selected/hovered word in dictd.
show_lemma_dictionary_key=ctrl+alt+l
# Run the configured left/right action for the selected word.
activate_left_key=ctrl+alt+ENTER
activate_right_key=ctrl+alt+shift+ENTER
# Empty selection_color preserves each morph's original AnkiMorphs status color.
# Set an ASS BGR color (e.g. &HFF0000&) to override the foreground.
selection_color=
selection_outline_color=&HFFFFFF&
selection_outline=3

# Action snippets run through /bin/sh. Use these named variables:
#   $word   = clicked surface form
#   $lemma  = spaCy lemma for that morph
#   $phrase = full sentence containing the clicked word, or the full current
#             subtitle cue when no word is selected/hovered
# Actions require a highlighted word only when they reference $word/$lemma
# (or legacy $1/$3). Phrase-only actions using $phrase/$2 need no selection.
# Variables are also exported to child processes.
# Do not wrap the entire *_script value in quotes or set shell=python3.
left_click_key=MBTN_LEFT
right_click_key=MBTN_RIGHT
left_click_script=
right_click_script=

# Up to six configurable keyboard actions. Set a key and a script for each.
# Example:
# action_1_key=ctrl+alt+w
# action_1_script=python3 "$HOME/.config/mpv/scripts/ankimorphs-dict/anki_browse.py" "$word" "$phrase"
action_1_key=
action_1_script=
action_2_key=
action_2_script=
action_3_key=
action_3_script=
action_4_key=
action_4_script=
action_5_key=
action_5_script=
action_6_key=
action_6_script=
