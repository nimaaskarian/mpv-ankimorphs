# Add these lines to ~/.config/mpv/script-opts/ankimorphs-dict.conf.
# They are an example for the companion script's existing action_1 slot.
# $word = clicked surface morph; $lemma = spaCy lemma; $phrase = sentence.
# The action runner exposes all three as shell variables and environment vars.

# ctrl+alt+b opens Anki's Browser with:
#   deck:"deutsch" "am-study-morphs:<clicked morph>" "<subtitle sentence>"
action_1_key=ctrl+alt+b
action_1_script=python3 "$HOME/.config/mpv/scripts/ankimorphs-dict/anki_browse.py" "$word" "$phrase"

# To use a different deck, export this variable before starting mpv:
# export ANKIMORPHS_BROWSE_DECK='German::Vocabulary'
# Optional AnkiConnect settings:
# export ANKICONNECT_URL='http://127.0.0.1:8765'
# export ANKICONNECT_KEY='your-api-key'
